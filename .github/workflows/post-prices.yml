name: Post prices

on:
  schedule:
    # هر ۱۰ دقیقه (حداقل مجاز گیت‌هاب ۵ دقیقه است). زمان‌ها به UTC هستند.
    - cron: "*/10 * * * *"
  workflow_dispatch:      # دکمه‌ی Run workflow برای تست دستی
    inputs:
      mode:
        description: "post = ارسال پست، bale-chats = پیدا کردن شناسه‌ی کانال بله، check = بررسی منابع"
        default: post
        type: choice
        options: [post, bale-chats, check, probe]

concurrency:
  group: post-prices
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post to channels
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHAT_ID: ${{ secrets.EITAA_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # تنظیمات اختیاری از تب Variables مخزن
          ITEMS: ${{ vars.ITEMS }}
          HEADER: ${{ vars.HEADER }}
          FOOTER: ${{ vars.FOOTER }}
          TELEGRAM_FOOTER: ${{ vars.TELEGRAM_FOOTER }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          # سرورهای گیت‌هاب خارج از ایران‌اند و نوبیتکس به آن‌ها جواب نمی‌دهد
          DISABLED_SOURCES: nobitex
        run: |
          case "${{ inputs.mode || 'post' }}" in
            bale-chats) python bot.py --bale-chats ;;
            check)      python bot.py --check ;;
            probe)      curl -gsS -m 30 -A "Mozilla/5.0" "https://www.tgju.org/gold-funds" -o /tmp/o || true
                        python3 -c "
          import re; h=open('/tmp/o',encoding='utf-8').read()
          i=h.find('data-sort=\"ارزش ریالی خالص دارایی')
          t0=h.rfind('<table',0,i); t1=h.find('</table>',i); t=h[t0:t1]
          clean=lambda x: re.sub(r'\s+',' ',re.sub(r'<style.*?</style>|<[^>]+>',' ',x,flags=re.S)).strip()
          print('HEAD', [clean(x) for x in re.findall(r'<th[^>]*>(.*?)</th>', t.split('</thead>')[0], re.S)])
          for r in re.findall(r'<tr[^>]*>(.*?)</tr>', t.split('</thead>')[-1], re.S)[:30]:
              print('ROW', [clean(c) for c in re.findall(r'<t[hd][^>]*>(.*?)</t[hd]>', r, re.S)])" ;;
            *)          python bot.py --once ;;
          esac
