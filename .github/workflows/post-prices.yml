name: Post prices

on:
  schedule:
    # هر ۱۰ دقیقه (حداقل مجاز گیت‌هاب ۵ دقیقه است). زمان‌ها به UTC هستند.
    - cron: "*/10 * * * *"
  workflow_dispatch:      # دکمه‌ی Run workflow برای تست دستی
    inputs:
      mode:
        description: "post = ارسال پست، bale-chats = پیدا کردن شناسه‌ی کانال بله، check = بررسی منابع"
        default: post
        type: choice
        options: [post, bale-chats, check, probe]

concurrency:
  group: post-prices
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post to channels
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHAT_ID: ${{ secrets.EITAA_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # تنظیمات اختیاری از تب Variables مخزن
          ITEMS: ${{ vars.ITEMS }}
          HEADER: ${{ vars.HEADER }}
          FOOTER: ${{ vars.FOOTER }}
          TELEGRAM_FOOTER: ${{ vars.TELEGRAM_FOOTER }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          # سرورهای گیت‌هاب خارج از ایران‌اند و نوبیتکس به آن‌ها جواب نمی‌دهد
          DISABLED_SOURCES: nobitex
        run: |
          case "${{ inputs.mode || 'post' }}" in
            bale-chats) python bot.py --bale-chats ;;
            check)      python bot.py --check ;;
            probe)      for u in \
                          "https://fund.fipiran.ir/api/v1/fund/fundcompare" \
                          "https://cdn.tsetmc.com/api/ClosingPrice/GetMarketWatch?market=0&paperTypes[0]=1&paperTypes[1]=2&paperTypes[2]=3&paperTypes[3]=4&paperTypes[4]=5&paperTypes[5]=6&paperTypes[6]=7&paperTypes[7]=8&paperTypes[8]=9&showTraded=false&withBestLimits=false" \
                          "https://old.tsetmc.com/tsev2/data/MarketWatchPlus.aspx" \
                          "https://www.tgju.org/profile/ime_fund_ayar" ; do
                          echo "== $u"; curl -sS -m 20 -A "Mozilla/5.0" "$u" | head -c 1500; echo; done ;;
            *)          python bot.py --once ;;
          esac
