name: Post prices

on:
  schedule:
    # هر ۱۰ دقیقه (حداقل مجاز گیت‌هاب ۵ دقیقه است). زمان‌ها به UTC هستند.
    - cron: "*/10 * * * *"
  workflow_dispatch:      # دکمه‌ی Run workflow برای تست دستی
    inputs:
      mode:
        description: "post = ارسال پست، bale-chats = پیدا کردن شناسه‌ی کانال بله، check = بررسی منابع"
        default: post
        type: choice
        options: [post, bale-chats, check, probe]

concurrency:
  group: post-prices
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post to channels
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          EITAA_TOKEN: ${{ secrets.EITAA_TOKEN }}
          EITAA_CHAT_ID: ${{ secrets.EITAA_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # تنظیمات اختیاری از تب Variables مخزن
          ITEMS: ${{ vars.ITEMS }}
          HEADER: ${{ vars.HEADER }}
          FOOTER: ${{ vars.FOOTER }}
          TELEGRAM_FOOTER: ${{ vars.TELEGRAM_FOOTER }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          # سرورهای گیت‌هاب خارج از ایران‌اند و نوبیتکس به آن‌ها جواب نمی‌دهد
          DISABLED_SOURCES: nobitex
        run: |
          case "${{ inputs.mode || 'post' }}" in
            bale-chats) python bot.py --bale-chats ;;
            check)      python bot.py --check ;;
            probe)      curl -gsS -m 30 -A "Mozilla/5.0" "https://www.tgju.org/gold-funds/2/%D8%A2%D8%AA%D8%B4" -o /tmp/o || true
                        python3 -c "
          import re; h=open('/tmp/o',encoding='utf-8').read(); print('SIZE',len(h))
          clean=lambda x: re.sub(r'\s+',' ',re.sub(r'<script.*?</script>|<style.*?</style>|<[^>]+>',' ',x,flags=re.S)).strip()
          txt=clean(h)
          for k in ['ابطال','صدور','حباب','NAV','هر واحد','قیمت پایانی','آخرین معامله']:
              for m in re.finditer(k, txt):
                  print('HIT', k, '|', txt[max(0,m.start()-150):m.end()+150]); break
          print('API', set(re.findall(r'https?://[^\"\' ]*(?:api|ajax|json)[^\"\' ]*', h))[:0] if False else sorted(set(re.findall(r'https?://[^\"\' <>]*(?:api|ajax|json)[^\"\' <>]*', h)))[:20])" ;;
            *)          python bot.py --once ;;
          esac
